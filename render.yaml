databases:
  # Base de datos gestionada PostgreSQL en Render
  - name: geoapp-db
    databaseName: geoapp
    user: prisma_enla
    plan: free

services:
  # Servicio Web para el Backend API (Express + TypeScript + Prisma)
  - type: web
    name: geoapp-backend
    runtime: node
    rootDir: backendGeo
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geoapp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: geoapp-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    plan: free

  # Servicio de Redis en Render
  - type: redis
    name: geoapp-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []


  # Servicio Web Estático para el Frontend (Vue 3 + Vite Admin Portal)
  - type: web
    name: geoapp-frontend
    runtime: static
    rootDir: admin-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: geoapp-backend
          property: host
